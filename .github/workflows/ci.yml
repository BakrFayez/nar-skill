# NAR CI — runs on GitHub Actions.
#
# Status: the unit-and-syntax job is EXECUTED AND PASSING
# on GitHub Actions (runs #1–#12 through the 2.6.0 release,
# all "success"). Two changes land with 2.6.1 (prepared in
# the repo; applied through the web UI at publication
# time, since the push channel cannot carry workflow
# files):
#   1. The install step adds pyyaml, so the YAML validity
#      tests run in CI instead of skipping (they skip
#      honestly when PyYAML is absent).
#   2. A new e2e-public job: generates the public
#      synthetic fixtures and runs the e2e harness in
#      public mode (NAR_E2E_PUBLIC=1), which exercises
#      every case that needs no private fixtures. Cases
#      bound to the private fixture tree SKIP; the doctor
#      case also SKIPs in public mode when the runner
#      lacks the full core toolchain (apktool / jadx /
#      Android build-tools are not preinstalled on the
#      hosted runners) — the job goes red only on a real
#      failure in the fixture-independent subset.
name: nar-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: pip install pytest pyyaml
      - name: Unit tests
        run: python3 -m pytest tests/unit/ -q
      - name: Syntax-check every script
        run: |
          for f in scripts/*.py; do
            python3 -m py_compile "$f"
          done
          python3 -m py_compile scripts/narlib/*.py
      - name: Unified CLI smoke
        run: |
          python3 scripts/nar.py version
          python3 scripts/nar.py --help > /dev/null

  e2e-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate the public synthetic fixtures
        run: python3 tests/generate_fixtures.py --out "$RUNNER_TEMP/nar-public-fixtures"
      - name: E2E harness (public subset, no private fixtures)
        run: NAR_E2E_PUBLIC=1 bash tests/run_e2e.sh
